name: Upstream check

# Once a week: what is new in the original (cmagnussen/blitztext-app) and not yet in this
# fork becomes an issue "Neu im Original" (label "upstream"). Nothing is merged; you pick what
# to take over. "Run workflow" in the Actions tab checks right away.

on:
  schedule:
    # Mondays, 06:23 UTC
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: List what is new in the original
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history, to tell which of the original's changes are here already.
          fetch-depth: 0

      - name: Open an issue for new changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/upstream-check.py
