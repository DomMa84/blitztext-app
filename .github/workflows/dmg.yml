name: DMG

# Builds the installer (DoMa-Talk-<version>.dmg) on GitHub's Macs, so nobody needs Xcode
# on their own Mac to install a build of this repository.
# - every push to main and "Run workflow" in the Actions tab: the DMG is an artifact of the run
# - a pull request that changes how the DMG is built: the same, to try it before merging
# - a published release (tag such as v1.18.1-1): the DMG is attached to it, and only the two
#   newest releases stay; older ones go with their tags (see docs/setup.md)

on:
  pull_request:
    paths:
      - build.sh
      - scripts/**
      - .github/workflows/dmg.yml
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build installer
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      # Only the release steps write; everything else reads.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dmgbuild
        run: python3 -m pip install dmgbuild==2.0.0

      - name: Build app and DMG
        run: ./build.sh --dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: DoMa-Talk-DMG
          path: dist/*.dmg
          if-no-files-found: error
          # The DMG is compressed already.
          compression-level: 0

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          dmg="dist/DoMa-Talk-${TAG}.dmg"
          mv dist/*.dmg "$dmg"
          gh release upload "$TAG" "$dmg" --clobber
          # The install steps once, below what the release says.
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if ! grep -q "blitztext-install-notes" "$RUNNER_TEMP/notes.md"; then
            printf '\n\n' >> "$RUNNER_TEMP/notes.md"
            cat .github/release-install-notes.md >> "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Keep the two newest releases
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: 2
        run: |
          # Newest first; the new release and the one before it stay as the way back,
          # everything older goes with its tag.
          gh release list --limit 100 --exclude-drafts --json tagName,publishedAt \
            --jq "sort_by(.publishedAt) | reverse | .[${KEEP}:] | .[].tagName" |
          while read -r old; do
            echo "Removing release $old"
            gh release delete "$old" --yes --cleanup-tag
          done
